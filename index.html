<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE うんちんぐすたいる</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 描画層：全ての演出はここ -->
        <canvas id="effect-canvas"></canvas>

        <!-- UI層：タイトル -->
        <div id="screen-title" class="screen active">
            <h1 class="game-title">THE<br>うんちんぐすたいる</h1>
            <button id="btn-start" class="main-button">START</button>
            <div class="score-display">HIGH SCORE: <span id="title-high-score">0</span></div>
        </div>

        <!-- UI層：ゲーム中 -->
        <div id="screen-game" class="screen">
            <div class="hud">
                <div class="hud-item">TIME: <span id="time-left">10.0</span></div>
                <div class="hud-item">SCORE: <span id="score-val">0</span></div>
            </div>
            <div id="butt-target">
                <div class="cheek left"></div>
                <div class="cheek right"></div>
                <!-- 実際のクリック判定エリア -->
                <div id="tap-area"></div>
            </div>
            <div class="instruction">連打でキバれ！</div>
        </div>

        <!-- UI層：結果画面 -->
        <div id="screen-result" class="screen">
            <div id="ending-img-wrap">
                <img id="ending-img" src="assets/ending.png" alt="ENDING" onerror="this.style.opacity='0'">
            </div>
            <h2 class="res-label">RESULT</h2>
            <div id="final-score" class="final-score">0</div>
            <div id="rank-name" class="rank-name">赤ちゃん</div>
            <div class="score-display">HIGH SCORE: <span id="result-high-score">0</span></div>
            <button id="btn-retry" class="main-button">RETRY</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
