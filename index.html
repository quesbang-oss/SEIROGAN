<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE うんちんぐすたいる</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 背景レイヤー -->
        <div id="bg-gradient"></div>

        <!-- タイトル画面 -->
        <div id="screen-title" class="screen active">
            <h1 class="game-title">THE<br>うんちんぐすたいる</h1>
            <button id="btn-start" class="main-button">START</button>
        </div>

        <!-- ゲームプレイ画面 -->
        <div id="screen-game" class="screen">
            <div id="hud">
                <div class="hud-item">TIME: <span id="time-val">10.0</span></div>
                <div class="hud-item">SCORE: <span id="score-val">0</span></div>
                <div class="hud-item">BEST: <span id="high-score-val">0</span></div>
            </div>
            
            <div id="target-area">
                <div class="buttocks">
                    <div class="cheek left"></div>
                    <div class="cheek right"></div>
                </div>
                <div id="tap-zone"></div>
            </div>
        </div>

        <!-- 演出・結果画面 -->
        <canvas id="game-canvas"></canvas>
        
        <div id="screen-result" class="screen">
            <div id="ending-img-container">
                <img id="ending-img" src="assets/ending.png" alt="Ending">
            </div>
            <div class="result-board">
                <h2 class="result-title">RESULT</h2>
                <div class="result-score">SCORE: <span id="final-score">0</span></div>
                <div class="result-best">BEST: <span id="final-best">0</span></div>
                <div class="result-rank">称号: <span id="rank-text">---</span></div>
                <button id="btn-retry" class="main-button">RETRY</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
